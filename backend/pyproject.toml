[project]
name = "logintel-backend"
version = "0.1.0"
description = "Real-Time Log Intelligence & Security Observability Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "drain3>=0.9.11",
    "numpy>=2.1",
    "boto3>=1.35",
    "python-json-logger>=2.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
